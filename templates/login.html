{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card p-4 shadow-lg border-warning">
            <h2 class="text-center text-warning mb-4"><i class="fas fa-user-circle me-2"></i>Login</h2>
            
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-warning w-100 btn-lg mb-3 fw-bold">Sign In</button>
            </form>
            
            <div class="mt-2 text-center">
                <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-warning">Create Account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
